name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-fast:
    name: gate-fast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The lint and fmt.Errorf ratchets compare against the merge-base with origin/main.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-only: true

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Configure git like a developer machine
        # Unit tests create real repositories and expect the branch to be
        # named main, a commit identity to exist, and file:// submodule
        # clones to be allowed. Repo-local config set by tests still wins.
        run: |
          git config --global init.defaultBranch main
          git config --global user.name "camp-ci"
          git config --global user.email "camp-ci@users.noreply.github.com"
          git config --global protocol.file.allow always

      - name: gate-fast
        run: just gate-fast
